<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Projects with Advanced CSS Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 150px;
            gap: 15px;
        }

        .project {
            background-color: #dce8f7;
            padding: 20px;
            border-radius: 8px;
        }

        .large {
            grid-column: span 2;
            grid-row: span 2;
        }

        @media (max-width: 700px) {
            .projects {
                grid-template-columns: 1fr;
                grid-auto-rows: auto;
            }

            .large {
                grid-column: span 1;
                grid-row: span 1;
            }
        }
    </style>
</head>
<body>
    <h1>My Projects</h1>

    <main class="projects">
        <section class="project large">
            <h2>Portfolio Website</h2>
            <p>A larger project card that takes two columns and two rows.</p>
        </section>

        <section class="project">
            <h2>Bio Page</h2>
            <p>A simple HTML page.</p>
        </section>

        <section class="project">
            <h2>Flexbox Layout</h2>
            <p>A layout made with Flexbox.</p>
        </section>

        <section class="project">
            <h2>Grid Layout</h2>
            <p>A layout made with CSS Grid.</p>
        </section>

        <section class="project">
            <h2>Git Practice</h2>
            <p>Basic Git commands.</p>
        </section>
    </main>
</body>
</html>
