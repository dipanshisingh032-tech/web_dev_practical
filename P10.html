<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Header and Footer with Flexbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            background-color: #243b55;
            color: white;
            padding: 20px;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            padding: 25px;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            background-color: #eeeeee;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
        </nav>
    </header>

    <main>
        <h2>Welcome</h2>
        <p>This is my portfolio website. The header and footer use Flexbox.</p>
    </main>

    <footer>
        <p>© 2026 My Portfolio</p>
        <p>Email: student@example.com</p>
    </footer>
</body>
</html>
